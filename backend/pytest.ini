[pytest]
# Run from the backend/ directory. `pythonpath = .` lets tests import
# `config`, `db.models` etc. without installing the project as a package.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning:passlib.*
