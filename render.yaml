# Render Blueprint for the Braintuitive API, on Render's free plan.
#
# In the Render dashboard: New > Blueprint, choose this repository (or paste
# its public URL), and fill in NEBIUS_API_KEY and PINECONE_API_KEY when asked.
# The website itself is on Vercel (frontend/vercel.json), which forwards /api
# here.
#
# What free means for this app:
# - The service sleeps after 15 minutes without visitors; the next visit waits
#   about a minute while it wakes. Open the site a minute before a demo.
# - There is no persistent disk. The SQLite database lives on the instance's
#   own disk and is wiped on every restart and every deploy: accounts, the
#   uploaded curriculum and all written questions. Sign up and upload again
#   after one, and allow about ten minutes for the first quizzes to be written.
#
# To keep data and stay awake, switch to plan: starter and add a disk mounted
# at /var/data with BRAINTUITIVE_DATA_DIR=/var/data (both paid).
services:
  - type: web
    name: braintuitive-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # One quiz for every level of every Unit 1 topic, written when the parent
      # approves the curriculum: 7 topics x 3 levels x 10 questions. The default
      # 90 covers Easy everywhere and little else, which left Medium and Tricky
      # to be written while a child waited on them.
      - key: BANK_PRIME_BUDGET
        value: "210"
      - key: SECRET_KEY
        generateValue: true
      - key: NEBIUS_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
